<body>

<main>

<div class="top">

<h1>Mes dépenses</h1>

<div class="topRight">

<button
 type="button"
 class="selectBtn"
 id="selectBtn"
 onclick="toggleSelectionMode()"
>
Sélectionner
</button>

<button
 type="button"
 class="addBtn"
 onclick="openManualExpense()"
>
+
</button>

<button
 type="button"

>
•••
</button>

</div>
</div>

<div
 class="backupMenu"

>

<button type="button" onclick="exportCSV()">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let currentMonth=new Date()

let editingId=null
let originalStatus=null

let selectionMode=false
let selectedIds=new Set()

let scanRun=0
let previewUrl=""

let expenses=[]

try{

 expenses=
 JSON.parse(
  localStorage.getItem("expenses")
  ||
  "[]"
 )

}
catch(error){

 expenses=[]

}


/*
 Nettoyage automatique des anciennes données.

 Les anciennes versions enregistraient photo + OCR.
 On les supprime maintenant pour libérer la mémoire.
*/

expenses=
expenses.map(
 oldExpense=>{

  const cleaned={
   id:
    oldExpense.id
    ||
    generateRawId(),

   date:
    oldExpense.date
    ||
    localToday(),

   merchant:
    oldExpense.merchant
    ||
    "Dépense",

   amount:
    Number(oldExpense.amount)
    ||
    0,

   status:
    oldExpense.status
    ||
    "to_send",

   sentDate:
    oldExpense.sentDate
    ||
    "",

   reimbursedDate:
    oldExpense.reimbursedDate
    ||
    ""
  }

  return cleaned

 }
)

saveLocal()

const $=
id=>document.getElementById(id)


function generateRawId(){

 return(
  Date.now().toString()
  +
  "-"
  +
  Math.floor(
   Math.random()*1000000
  ).toString()
 )

}


function createUniqueId(){

 let id=""

 do{

  id=
  generateRawId()

 }
 while(
  expenses.some(
   x=>
   String(x.id)===
   String(id)
  )
 )

 return id

}


/*
 Date locale iPhone,
 sans passage par UTC.
*/

function localToday(){

 const d=
 new Date()

 const year=
 d.getFullYear()

 const month=
 String(
  d.getMonth()+1
 )
 .padStart(2,"0")

 const day=
 String(
  d.getDate()
 )
 .padStart(2,"0")

 return(
  year+
  "-"+
  month+
  "-"+
  day
 )

}


function showToast(message){

 $("toast").textContent=
 message

 $("toast")
 .classList
 .add("show")

 setTimeout(
  ()=>{

   $("toast")
   .classList
   .remove("show")

  },
  2200
 )

}


function euro(n){

 return new Intl.NumberFormat(
  "fr-FR",
  {
   style:"currency",
   currency:"EUR"
  }
 ).format(
  Number(n)||0
 )

}


function sameMonth(s,d){

 if(!s)
 return false

 const parts=
 s.split("-")

 if(parts.length!==3)
 return false

 return(
  Number(parts[0])===
  d.getFullYear()
  &&
  Number(parts[1])===
  d.getMonth()+1
 )

}


function statusLabel(status){

 if(status==="sent")
 return "Envoyée"

 if(status==="reimbursed")
 return "Remboursée"

 return "À envoyer"

}


function render(){

 const q=
 $("search")
 .value
 .trim()
 .toLowerCase()

 const monthRows=
 expenses.filter(
  x=>
  sameMonth(
   x.date,
   currentMonth
  )
 )

 const rows=
 monthRows
 .filter(
  x=>
  !q
  ||
  String(
   x.merchant||""
  )
  .toLowerCase()
  .includes(q)
  ||
  String(x.amount)
  .includes(q)
 )
 .sort(
  (a,b)=>
  String(b.date)
  .localeCompare(
   String(a.date)
  )
 )


 $("month").textContent=
 new Intl.DateTimeFormat(
  "fr-FR",
  {
   month:"long",
   year:"numeric"
  }
 ).format(currentMonth)


 const total=
 monthRows.reduce(
  (sum,x)=>
  sum+
  Number(x.amount||0),
  0
 )


 $("total").textContent=
 euro(total)


 $("count").textContent=
 monthRows.length+
 " dépense"+
 (
  monthRows.length>1
  ?
  "s"
  :
  ""
 )


 const toSend=
 monthRows.filter(
  x=>
  x.status==="to_send"
 ).length


 const sent=
 monthRows.filter(
  x=>
  x.status==="sent"
 ).length


 const paid=
 monthRows.filter(
  x=>
  x.status==="reimbursed"
 ).length


 $("summary").textContent=
 toSend+
 " à envoyer • "+
 sent+
 " envoyée"+
 (sent>1?"s":"")+
 " • "+
 paid+
 " remboursée"+
 (paid>1?"s":"")


 if(!rows.length){

  $("list").innerHTML=
  '<div class="empty">'+
  '👛'+
  '<h2>Aucune dépense</h2>'+
  'Scanne un justificatif ou ajoute une dépense manuellement.'+
  '</div>'

  return

 }


 $("list").innerHTML=
 rows.map(
  x=>{

   const id=
   String(x.id)

   const selected=
   selectedIds.has(id)

   const check=
   selectionMode
   ?
   `
   <div class="check ${selected?"selected":""}">
   ${selected?"✓":""}
   </div>
   `
   :
   ""

   return`

   <div
    class="item"
    onclick="handleExpenseClick('${escapeJS(id)}')"
   >

    <div class="itemLeft">

     ${check}

     <div class="itemText">

      <b>
      ${escapeHTML(x.merchant)}
      </b>

      <span>
      ${formatDate(x.date)}
      </span>

      <div class="badge ${x.status}">
      ${statusLabel(x.status)}
      </div>

     </div>

    </div>

    <div class="itemRight">

     <b>
     ${euro(x.amount)}
     </b>

    </div>

   </div>

   `

  }
 ).join("")

}


function escapeHTML(value){

 return String(value)
 .replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 )

}


function escapeJS(value){

 return String(value)
 .replace(
  /\\/g,
  "\\\\"
 )
 .replace(
  /'/g,
  "\\'"
 )

}


function formatDate(s){

 if(!s)
 return ""

 const parts=
 String(s).split("-")

 if(parts.length!==3)
 return s

 return(
  parts[2]+
  "/"+
  parts[1]+
  "/"+
  parts[0]
 )

}


function moveMonth(n){

 currentMonth=
 new Date(
  currentMonth.getFullYear(),
  currentMonth.getMonth()+n,
  1
 )

 selectedIds.clear()

 render()

}


function handleExpenseClick(id){

 if(selectionMode){

  if(selectedIds.has(id))
  selectedIds.delete(id)

  else
  selectedIds.add(id)

  render()

  return

 }

 openExpense(id)

}


function toggleSelectionMode(){

 selectionMode=
 !selectionMode

 selectedIds.clear()

 $("selectBtn").textContent=
 selectionMode
 ?
 "Annuler"
 :
 "Sélectionner"


 $("scanButton").style.display=
 selectionMode
 ?
 "none"
 :
 "block"


 $("batchBar")
 .classList
 .toggle(
  "open",
  selectionMode
 )


 render()

}


function batchStatus(newStatus){

 if(!selectedIds.size){

  alert(
   "Sélectionne au moins une dépense."
  )

  return

 }


 const date=
 localToday()


 expenses=
 expenses.map(
  expense=>{

   if(
    !selectedIds.has(
     String(expense.id)
    )
   )
   return expense


   if(newStatus==="to_send"){

    return{
     ...expense,
     status:"to_send",
     sentDate:"",
     reimbursedDate:""
    }

   }


   if(newStatus==="sent"){

    return{
     ...expense,
     status:"sent",
     sentDate:date,
     reimbursedDate:""
    }

   }


   return{
    ...expense,
    status:"reimbursed",
    sentDate:
     expense.sentDate
     ||
     date,
    reimbursedDate:date
   }

  }
 )


 const count=
 selectedIds.size


 saveLocal()

 toggleSelectionMode()


 showToast(
  count+
  " dépense"+
  (count>1?"s":"")+
  " mise"+
  (count>1?"s":"")+
  " à jour"
 )

}


function deleteSelectedExpenses(){

 if(!selectedIds.size){

  alert(
   "Sélectionne au moins une dépense."
  )

  return

 }


 const selectedExpenses=
 expenses.filter(
  x=>
  selectedIds.has(
   String(x.id)
  )
 )


 const count=
 selectedExpenses.length


 const total=
 selectedExpenses.reduce(
  (sum,x)=>
  sum+
  Number(x.amount||0),
  0
 )


 const confirmed=
 confirm(
  "Supprimer "+
  count+
  " dépense"+
  (count>1?"s":"")+
  " ?\n\n"+
  "Montant total : "+
  euro(total)+
  "\n\nCette action est définitive."
 )


 if(!confirmed)
 return


 expenses=
 expenses.filter(
  x=>
  !selectedIds.has(
   String(x.id)
  )
 )


 saveLocal()


 selectionMode=false
 selectedIds.clear()


 $("selectBtn").textContent=
 "Sélectionner"


 $("scanButton").style.display=
 "block"


 $("batchBar")
 .classList
 .remove("open")


 render()


 showToast(
  count+
  " dépense"+
  (count>1?"s":"")+
  " supprimée"+
  (count>1?"s":"")
 )

}


function toggleBackupMenu(){

 $("backupMenu")
 .classList
 .toggle("open")

}


document.addEventListener(
 "click",
 e=>{

  const menu=
  $("backupMenu")

  const button=
  document.querySelector(
   ".menuBtn"
  )


  if(
   !menu.contains(e.target)
   &&
   e.target!==button
  ){

   menu
   .classList
   .remove("open")

  }

 }
)


function resetExpenseSheet(){

 editingId=null
 originalStatus=null

 $("date").value=
 localToday()

 $("merchant").value=""

 $("amount").value=""

 $("expenseStatus").value=
 "to_send"

 $("statusInfo").textContent=""

 $("deleteButton").style.display=
 "none"

 $("ocrStatus").style.display=
 "none"

 $("ocrStatus").textContent=
 "Analyse du ticket…"

 clearPreview()

}


function openManualExpense(){

 /*
  Invalide toute ancienne analyse OCR.
 */

 scanRun++

 resetExpenseSheet()

 $("sheetTitle").textContent=
 "Nouvelle dépense"

 $("sheet")
 .classList
 .add("open")

}


function startScan(){

 scanRun++

 resetExpenseSheet()

 $("sheetTitle").textContent=
 "Vérifier la dépense"

 $("camera").value=""

 $("camera").click()

}


/*
 Réduction de la photo avant OCR.

 Une photo iPhone originale peut être énorme.
 On limite à environ 1600 px.
*/

function resizeImageFile(file,maxSide=1600){

 return new Promise(
  (resolve,reject)=>{

   const objectUrl=
   URL.createObjectURL(file)

   const img=
   new Image()


   img.onload=
   ()=>{

    try{

     let width=
     img.naturalWidth

     let height=
     img.naturalHeight


     if(
      width>maxSide
      ||
      height>maxSide
     ){

      const ratio=
      Math.min(
       maxSide/width,
       maxSide/height
      )

      width=
      Math.round(
       width*ratio
      )

      height=
      Math.round(
       height*ratio
      )

     }


     const canvas=
     document.createElement(
      "canvas"
     )

     canvas.width=width
     canvas.height=height


     const ctx=
     canvas.getContext(
      "2d"
     )


     ctx.drawImage(
      img,
      0,
      0,
      width,
      height
     )


     const dataUrl=
     canvas.toDataURL(
      "image/jpeg",
      0.82
     )


     URL.revokeObjectURL(
      objectUrl
     )


     resolve(
      dataUrl
     )

    }

    catch(error){

     URL.revokeObjectURL(
      objectUrl
     )

     reject(error)

    }

   }


   img.onerror=

     objectUrl
    )

    reject(
     new Error(

     )
    )

   }


   img.src=
   objectUrl

  }
 )

}

function normalizeOCRText(text){

 return String(text||"")
 .replace(
  /\u00A0/g,
  " "
 )
 .replace(
  /€/g,
  " € "
 )

}


function lines(text){

 return normalizeOCRText(text)
 .split(/\r?\n/)
 .map(
  x=>
  x.trim()
 )
 .filter(Boolean)

}


function findDate(text){

 let match=
 String(text).match(
  /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{4})\b/
 )


 if(!match){

  match=
  String(text).match(
   /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{2})\b/
  )

 }


 if(!match)
 return ""


 let year=
 Number(match[3])


 if(year<100)
 year+=2000


 const month=
 Number(match[2])


 const day=
 Number(match[1])


 if(
  month<1
  ||
  month>12
  ||
  day<1
  ||
  day>31
 )
 return ""


 return(
  year+
  "-"+
  String(month)
  .padStart(2,"0")
  +
  "-"+
  String(day)
  .padStart(2,"0")
 )

}


/*
 Extrait tous les montants possibles
 d'une ligne OCR.

 Exemples reconnus :
 12,50
 12.50
 12,50 €
 12.50 EUR
 1 234,56
*/

function amountsFromLine(line){

 const normalized=
 String(line)
 .replace(
  /(\d)\s+(\d{3})(?=[,.]\d{2}\b)/g,
  "$1$2"
 )


 const matches=
 [
  ...normalized.matchAll(
   /(?:^|[^\d])(\d{1,6}(?:[ .]\d{3})*[,.]\d{2})(?=$|[^\d])/g
  )
 ]


 return matches
 .map(
  m=>{

   const value=
   m[1]
   .replace(/\s/g,"")
   .replace(
    /(?<=\d)\.(?=\d{3}[,.])/g,
    ""
   )
   .replace(
    ",",
    "."
   )


   const number=
   Number(value)


   return(
    Number.isFinite(number)
    ?
    number
    :
    null
   )

  }
 )
 .filter(
  x=>
  x!==null
  &&
  x>0
  &&
  x<100000
 )

}


/*
 Recherche d'abord les lignes les plus
 susceptibles de contenir le vrai total.
*/

function findAmount(text){

 const textLines=
 lines(text)


 const strongKeys=[
  "NET A PAYER",
  "NET À PAYER",
  "A PAYER",
  "À PAYER",
  "TOTAL TTC",
  "TOTAL EUR",
  "TOTAL €",
  "MONTANT TTC",
  "MONTANT"
 ]


 const mediumKeys=[
  "TOTAL",
  "CB",
  "CARTE"
 ]


 function searchWithKeys(keys){

  for(
   const key of keys
  ){

   for(
    let i=0;
    i<textLines.length;
    i++
   ){

    const upper=
    textLines[i]
    .toUpperCase()


    if(
     !upper.includes(key)
    )
    continue


    /*
     Montant sur la même ligne.
    */

    const sameLine=
    amountsFromLine(
     textLines[i]
    )


    if(sameLine.length){

     return(
      sameLine[
       sameLine.length-1
      ]
     )

    }


    /*
     Certains tickets mettent :
     TOTAL
     23,40 €
    */

    if(
     i+1<
     textLines.length
    ){

     const nextLine=
     amountsFromLine(
      textLines[i+1]
     )


     if(nextLine.length){

      return(
       nextLine[
        nextLine.length-1
       ]
      )

     }

    }

   }

  }


  return null

 }


 let result=
 searchWithKeys(
  strongKeys
 )


 if(result!==null)
 return result


 result=
 searchWithKeys(
  mediumKeys
 )


 if(result!==null)
 return result


 /*
  Dernier recours :
  on récupère tous les montants.

  On privilégie un montant accompagné
  d'un symbole € ou EUR.
 */

 const currencyCandidates=[]


 for(
  const line of textLines
 ){

  if(
   /€|EUR/i.test(line)
  ){

   currencyCandidates.push(
    ...amountsFromLine(line)
   )

  }

 }


 if(
  currencyCandidates.length
 ){

  return Math.max(
   ...currencyCandidates
  )

 }


 const all=[]


 for(
  const line of textLines
 ){

  all.push(
   ...amountsFromLine(line)
  )

 }


 if(!all.length)
 return null


 /*
  Ce fallback n'est utilisé qu'en dernier recours.
 */

 return Math.max(...all)

}


function findMerchant(text){

 const ignore=
 /ticket|facture|total|tva|merci|carte|visa|date|siret|siren|www|http|montant|payer|eur/i


 for(
  const line of
  lines(text).slice(0,15)
 ){

  if(
   line.length<3
   ||
   line.length>60
   ||
   ignore.test(line)
  )
  continue


  const letters=
  (
   line.match(
    /[A-Za-zÀ-ÿ]/g
   )
   ||
   []
  ).length


  if(letters<3)
  continue


  return line

 }


 return "Dépense"

}

function csvEscape(value){

 String(
  value??""
 )

  value.includes(";")

  ||

 ){

function importCSVText(text){

 text=
 String(text)
 .replace(
  /^\uFEFF/,
  ""
 )


 const rows=
 parseCSV(text)


 if(rows.length<2){

  alert(
   "Le fichier CSV ne contient aucune dépense."
  )

  return

 }


 const headers=
 rows[0]
 .map(
  x=>
  x.trim()
  .toLowerCase()
 )


 const idIndex=
 headers.findIndex(
  x=>
  x==="id"
  ||
  x==="id dépense"
  ||
  x==="id depense"
 )


 const dateIndex=
 headers.findIndex(
  x=>
  x==="date"
 )


 const descriptionIndex=
 headers.findIndex(
  x=>
  x==="description"
  ||
  x==="commerçant"
  ||
  x==="commercant"
 )


 const amountIndex=
 headers.findIndex(
  x=>
  x==="montant"
  ||
  x==="amount"
 )


 const statusIndex=
 headers.findIndex(
  x=>
  x==="statut"
  ||
  x==="status"
 )


 const sentIndex=
 headers.findIndex(
  x=>
  x==="date envoi"
  ||
  x==="date d'envoi"
 )


 const reimbursedIndex=
 headers.findIndex(
  x=>
  x==="date remboursement"
  ||
  x==="date de remboursement"
 )


 if(
  dateIndex===-1
  ||
  descriptionIndex===-1
  ||
  amountIndex===-1
 ){

  alert(
   "CSV non reconnu.\n\nColonnes attendues : Date ; Description ; Montant"
  )

  return

 }


 let imported=0
 let duplicates=0
 let invalid=0
 let generatedIds=0


 for(
  let i=1;
  i<rows.length;
  i++
 ){

  const row=
  rows[i]


  const date=
  parseImportedDate(
   row[dateIndex]
  )


  const merchant=
  String(
   row[descriptionIndex]
   ??
   ""
  )
  .trim()


  const amount=
  parseImportedAmount(
   row[amountIndex]
  )


  if(
   !date
   ||
   !merchant
   ||
   amount===null
  ){

   invalid++

   continue

  }


  let importedId=""


  if(
   idIndex!==-1
  ){

   importedId=
   String(
    row[idIndex]
    ??
    ""
   )
   .trim()

  }


  if(importedId){

   const exists=
   expenses.some(
    x=>
    String(x.id)===
    importedId
   )


   if(exists){

    duplicates++

    continue

   }

  }

  else{

   importedId=
   createUniqueId()

   generatedIds++

  }


  let status=
  "to_send"


  if(
   statusIndex!==-1
  ){

   const value=
   String(
    row[statusIndex]
    ||
    ""
   )
   .trim()
   .toLowerCase()


   if(
    value.includes(
     "rembours"
    )
   ){

    status=
    "reimbursed"

   }

   else if(
    value.includes(
     "envoy"
    )
    &&
    !value.includes(
     "à envoyer"
    )
   ){

    status=
    "sent"

   }

  }


  const sentDate=
  sentIndex!==-1
  ?
  parseImportedDate(
   row[sentIndex]
  )
  :
  ""


  const reimbursedDate=
  reimbursedIndex!==-1
  ?
  parseImportedDate(
   row[reimbursedIndex]
  )
  :
  ""


  expenses.push({

   id:
   importedId,

   date,

   merchant,

   amount,

   status,

   sentDate,

   reimbursedDate

  })


  imported++

 }


 saveLocal()


 render()


 let message=
 imported+
 " dépense"+
 (imported>1?"s":"")+
 " importée"+
 (imported>1?"s":"")


 if(duplicates){

  message+=
  "\n"+
  duplicates+
  " ID déjà présent"+
  (duplicates>1?"s":"")+
  " ignoré"+
  (duplicates>1?"s":"")

 }


 if(generatedIds){

  message+=
  "\n"+
  generatedIds+
  " nouvel"+
  (generatedIds>1?"s":"")+
  " ID créé"+
  (generatedIds>1?"s":"")

 }


 if(invalid){

  message+=
  "\n"+
  invalid+
  " ligne"+
  (invalid>1?"s":"")+
  " non reconnue"+
  (invalid>1?"s":"")

 }


 alert(message)

}


function parseCSV(text){

 const rows=[]

 let row=[]
 let cell=""
 let quoted=false


 for(
  let i=0;
  i<text.length;
  i++
 ){

  const char=
  text[i]


  const next=
  text[i+1]


  if(char==='"'){

   if(
    quoted
    &&
    next==='"'
   ){

    cell+='"'

    i++

   }

   else{

    quoted=
    !quoted

   }


   continue

  }


  if(
   char===";"
   &&
   !quoted
  ){

   row.push(cell)

   cell=""

   continue

  }


  if(
   (
    char==="\n"
    ||
    char==="\r"
   )
   &&
   !quoted
  ){

   if(
    char==="\r"
    &&
    next==="\n"
   ){

    i++

   }


   row.push(cell)


   if(
    row.some(
     value=>
     String(value)
     .trim()!==""
    )
   ){

    rows.push(row)

   }


   row=[]
   cell=""


   continue

  }


  cell+=char

 }


 if(
  cell!==""
  ||
  row.length
 ){

  row.push(cell)


  if(
   row.some(
    value=>
    String(value)
    .trim()!==""
   )
  ){

   rows.push(row)

  }

 }


 return rows

}


function parseImportedDate(value){

 const text=
 String(
  value||""
 )
 .trim()


 if(!text)
 return ""


 let match=
 text.match(
  /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/
 )


 if(match){

  return(
   match[3]+
   "-"+
   String(
    Number(match[2])
   )
   .padStart(2,"0")
   +
   "-"+
   String(
    Number(match[1])
   )
   .padStart(2,"0")
  )

 }


 match=
 text.match(
  /^(\d{4})-(\d{1,2})-(\d{1,2})$/
 )


 if(match){

  return(
   match[1]+
   "-"+
   String(
    Number(match[2])
   )
   .padStart(2,"0")
   +
   "-"+
   String(
    Number(match[3])
   )
   .padStart(2,"0")
  )

 }


 return ""

}


function parseImportedAmount(value){

 const text=
 String(
  value||""
 )
 .trim()
 .replace(
  /\s/g,
  ""
 )
 .replace(
  "€",
  ""
 )
 .replace(
  ",",
  "."
 )


 const amount=
 Number(text)


 if(
  !Number.isFinite(amount)
  ||
  amount<=0
 ){

  return null

 }


 return amount

}
