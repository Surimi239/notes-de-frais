+

<script
 src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
></script>

<script>

let currentMonth=
new Date()

let photo=""

let ocr=""

let editingId=null

let expenses=
JSON.parse(
 localStorage.getItem("expenses")
 ||
 "[]"
)

const $=
id=>
document.getElementById(id)

function showToast(message){

 $("toast").textContent=
 message

 $("toast")
 .classList
 .add("show")

 setTimeout(
  ()=>{
   $("toast")
   .classList
   .remove("show")
  },
  2200
 )

}

function euro(n){

 return new Intl.NumberFormat(
  "fr-FR",
  {
   style:"currency",
   currency:"EUR"
  }
 ).format(n||0)

}

function sameMonth(s,d){

 const x=
 new Date(
  s+"T12:00:00"
 )

 return(
  x.getMonth()===
  d.getMonth()
  &&
  x.getFullYear()===
  d.getFullYear()
 )

}

function render(){

 const q=
 $("search")
 .value
 .toLowerCase()

 const monthRows=
 expenses
 .filter(
  x=>
  sameMonth(
   x.date,
   currentMonth
  )
 )

 const rows=
 monthRows
 .filter(
  x=>
  !q
  ||
  x.merchant
   .toLowerCase()
   .includes(q)
  ||
  String(x.amount)
   .includes(q)
 )
 .sort(
  (a,b)=>
  b.date.localeCompare(a.date)
 )

 $("month").textContent=
 new Intl.DateTimeFormat(
  "fr-FR",
  {
   month:"long",
   year:"numeric"
  }
 ).format(currentMonth)

 const total=
 monthRows.reduce(
  (sum,x)=>
  sum+
  Number(x.amount),
  0
 )

 $("total").textContent=
 euro(total)

 $("count").textContent=
 monthRows.length+
 " dépense"+
 (
  monthRows.length>1
  ?
  "s"
  :
  ""
 )

 if(!rows.length){

  $("list").innerHTML=
  '<div class="empty">'+
  '👛'+
  '<h2>Aucune dépense</h2>'+
  'Scanne un justificatif ou ajoute une dépense manuellement.'+
  '</div>'

  return
 }

 $("list").innerHTML=
 rows.map(
  x=>`

  <div
   class="item"
   onclick="openExpense(${x.id})"
  >

   <div>

    <b>
    ${escapeHTML(x.merchant)}
    </b>

    <br>

    <span>
    ${formatDate(x.date)}
    </span>

   </div>

   <b>
   ${euro(x.amount)}
   </b>

  </div>

  `
 ).join("")

}

function escapeHTML(s){

 return String(s)
 .replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 )

}

function formatDate(s){

 const parts=
 s.split("-")

 if(parts.length!==3)
 return s

 return(
  parts[2]+
  "/"+
  parts[1]+
  "/"+
  parts[0]
 )

}

function moveMonth(n){

 currentMonth=
 new Date(
  currentMonth.getFullYear(),
  currentMonth.getMonth()+n,
  1
 )

 render()

}

function toggleBackupMenu(){

 $("backupMenu")
 .classList
 .toggle("open")

}

document.addEventListener(
 "click",
 e=>{

  const menu=
  $("backupMenu")

  const menuButton=
  document.querySelector(
   ".menuBtn"
  )

  if(
   !menu.contains(e.target)
   &&
   e.target!==menuButton
  ){

   menu
   .classList
   .remove("open")

  }

 }
)

function openManualExpense(){

 editingId=null
 photo=""
 ocr=""

 $("sheetTitle").textContent=
 "Nouvelle dépense"

 $("date").value=
 new Date()
 .toISOString()
 .slice(0,10)

 $("merchant").value=""

 $("amount").value=""

 $("preview").src=""

 $("preview").style.display=
 "none"

 $("status").style.display=
 "none"

 $("deleteButton").style.display=
 "none"

 $("sheet")
 .classList
 .add("open")

}

function startScan(){

 editingId=null
 photo=""
 ocr=""

 $("sheetTitle").textContent=
 "Vérifier la dépense"

 $("deleteButton").style.display=
 "none"

 $("camera").click()

}

$("camera").onchange=
async e=>{

 const file=
 e.target.files[0]

 if(!file)
 return

 $("date").value=
 new Date()
 .toISOString()
 .slice(0,10)

 $("merchant").value=""

 $("amount").value=""

 $("status").style.display=
 "block"

 $("status").textContent=
 "Analyse du ticket…"

 const reader=
 new FileReader()

 reader.onload=
 async()=>{

  photo=
  reader.result

  $("preview").src=
  photo

  $("preview").style.display=
  "block"

  $("sheet")
  .classList
  .add("open")

  try{

   const result=
   await Tesseract.recognize(
    photo,
    "fra+eng",
    {

     logger:m=>{

      if(
       m.status===
       "recognizing text"
      ){

       $("status").textContent=
       "Lecture du ticket… "+
       Math.round(
        (m.progress||0)*100
       )+
       " %"

      }

     }

    }
   )

   ocr=
   result.data.text
   ||
   ""

   const detectedDate=
   findDate(ocr)

   const detectedAmount=
   findAmount(ocr)

   const detectedMerchant=
   findMerchant(ocr)

   if(detectedDate)
   $("date").value=
   detectedDate

   if(
    detectedAmount!==null
   )
   $("amount").value=
   detectedAmount.toFixed(2)

   $("merchant").value=
   detectedMerchant

   $("status").textContent=
   "Ticket analysé — vérifie puis enregistre."

  }
  catch(error){

   $("status").textContent=
   "Lecture automatique impossible. Tu peux remplir les champs manuellement."

  }

 }

 reader.readAsDataURL(file)

 e.target.value=""

}

function lines(text){

 return text
 .split(/\r?\n/)
 .map(
  x=>x.trim()
 )
 .filter(Boolean)

}

function findDate(text){

 let match=
 text.match(
  /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{4})\b/
 )

 if(!match){

  match=
  text.match(
   /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{2})\b/
  )

 }

 if(!match)
 return ""

 let year=
 Number(match[3])

 if(year<100)
 year+=2000

 return(
  year+
  "-"+
  String(
   Number(match[2])
  ).padStart(2,"0")
  +
  "-"+
  String(
   Number(match[1])
  ).padStart(2,"0")
 )

}

function getAmount(line){

 const matches=
 [...line.matchAll(
  /(\d{1,6}[,.]\d{2})/g
 )]

 if(!matches.length)
 return null

 return Number(
  matches[
   matches.length-1
  ][1]
  .replace(",",".")
 )

}

function findAmount(text){

 const textLines=
 lines(text)

 const keys=[
  "TOTAL TTC",
  "NET A PAYER",
  "NET À PAYER",
  "A PAYER",
  "À PAYER",
  "TOTAL",
  "MONTANT"
 ]

 for(
  const key of keys
 ){

  for(
   const line of
   textLines
   .filter(
    x=>
    x
    .toUpperCase()
    .includes(key)
   )
   .reverse()
  ){

   const amount=
   getAmount(line)

   if(amount!==null)
   return amount

  }

 }

 const values=
 textLines
 .map(getAmount)
 .filter(
  x=>
  x!==null
  &&
  x>0
 )

 return(
  values.length
  ?
  Math.max(...values)
  :
  null
 )

}

function findMerchant(text){

 const ignore=
 /ticket|facture|total|tva|merci|carte|visa|date|siret|www|http/i

 for(
  const line of
  lines(text).slice(0,12)
 ){

  if(
   line.length<3
   ||
   line.length>60
   ||
   ignore.test(line)
  )
  continue

  if(
   (
    line.match(
     /[A-Za-zÀ-ÿ]/g
    )
    ||
    []
   ).length<3
  )
  continue

  return line

 }

 return "Dépense"

}

function openExpense(id){

 const expense=
 expenses.find(
  x=>
  x.id===id
 )

 if(!expense)
 return

 editingId=
 id

 photo=
 expense.photo
 ||
 ""

 ocr=
 expense.ocr
 ||
 ""

 $("sheetTitle").textContent=
 "Modifier la dépense"

 $("date").value=
 expense.date

 $("merchant").value=
 expense.merchant

 $("amount").value=
 expense.amount

 $("preview").src=
 photo

 $("preview").style.display=
 photo
 ?
 "block"
 :
 "none"

 $("status").style.display=
 "none"

 $("deleteButton").style.display=
 "block"

 $("sheet")
 .classList
 .add("open")

}

function closeSheet(){

 $("sheet")
 .classList
 .remove("open")

 editingId=null

}

function saveExpense(){

 const date=
 $("date").value

 const merchant=
 $("merchant")
 .value
 .trim()

 const amount=
 Number(
  $("amount").value
 )

 if(
  !date
  ||
  !merchant
  ||
  !Number.isFinite(amount)
  ||
  amount<=0
 ){

  alert(
   "Vérifie la date, la description et le montant."
  )

  return

 }

 if(editingId){

  const index=
  expenses.findIndex(
   x=>
   x.id===editingId
  )

  if(index!==-1){

   expenses[index]={
    ...expenses[index],
    date,
    merchant,
    amount
   }

  }

 }
 else{

  expenses.push({

   id:Date.now(),

   date,

   merchant,

   amount,

   ocr,

   photo

  })

 }

 saveLocal()

 closeSheet()

 render()

 showToast(
  "Dépense enregistrée"
 )

}

function deleteExpense(){

 if(!editingId)
 return

 const expense=
 expenses.find(
  x=>
  x.id===editingId
 )

 if(!expense)
 return

 const confirmed=
 confirm(
  "Supprimer cette dépense ?\n\n"+
  expense.merchant+
  " — "+
  euro(expense.amount)
 )

 if(!confirmed)
 return

 expenses=
 expenses.filter(
  x=>
  x.id!==editingId
 )

 saveLocal()

 closeSheet()

 render()

 showToast(
  "Dépense supprimée"
 )

}

function saveLocal(){

 localStorage.setItem(
  "expenses",
  JSON.stringify(expenses)
 )

}

function exportCSV(){

 $("backupMenu")
 .classList
 .remove("open")

 if(!expenses.length){

  alert(
   "Aucune dépense à exporter."
  )

  return

 }

 const sorted=
 [...expenses]
 .sort(
  (a,b)=>
  a.date.localeCompare(b.date)
 )

 let csv=
 "\uFEFFDate;Description;Montant\n"

 for(
  const expense of sorted
 ){

  csv+=
  csvEscape(
   formatDate(expense.date)
  )
  +
  ";"
  +
  csvEscape(
   expense.merchant
  )
  +
  ";"
  +
  Number(
   expense.amount
  )
  .toFixed(2)
  .replace(".",",")
  +
  "\n"

 }

 const blob=
 new Blob(
  [csv],
  {
   type:
   "text/csv;charset=utf-8"
  }
 )

 const url=
 URL.createObjectURL(blob)

 const link=
 document.createElement("a")

 link.href=
 url

 link.download=
 "notes-de-frais.csv"

 link.click()

 setTimeout(
  ()=>{
   URL.revokeObjectURL(url)
  },
  1000
 )

}

function csvEscape(value){

 value=
 String(
  value
  ??
  ""
 )

 if(
  value.includes(";")
  ||
  value.includes('"')
  ||
  value.includes("\n")
 ){

  return(
   '"'+
   value.replaceAll(
    '"',
    '""'
   )+
   '"'
  )

 }

 return value

}

function startCSVImport(){

 $("backupMenu")
 .classList
 .remove("open")

 $("csvInput").click()

}

$("csvInput").onchange=
e=>{

 const file=
 e.target.files[0]

 if(!file)
 return

 const reader=
 new FileReader()

 reader.onload=
 ()=>{

  try{

   importCSVText(
    reader.result
   )

  }
  catch(error){

   alert(
    "Impossible de lire ce fichier CSV."
   )

  }

 }

 reader.readAsText(
  file,
  "UTF-8"
 )

 e.target.value=""

}

function importCSVText(text){

 text=
 String(text)
 .replace(
  /^\uFEFF/,
  ""
 )

 const rows=
 parseCSV(text)

 if(
  rows.length<2
 ){

  alert(
   "Le fichier CSV ne contient aucune dépense."
  )

  return

 }

 const headers=
 rows[0]
 .map(
  x=>
  x
  .trim()
  .toLowerCase()
 )

 const dateIndex=
 headers.findIndex(
  x=>
  x==="date"
 )

 const descriptionIndex=
 headers.findIndex(
  x=>
  x==="description"
  ||
  x==="commerçant"
  ||
  x==="commercant"
 )

 const amountIndex=
 headers.findIndex(
  x=>
  x==="montant"
  ||
  x==="amount"
 )

 if(
  dateIndex===-1
  ||
  descriptionIndex===-1
  ||
  amountIndex===-1
 ){

  alert(
   "CSV non reconnu.\n\nColonnes attendues : Date ; Description ; Montant"
  )

  return

 }

 let imported=0
 let duplicates=0
 let invalid=0

 for(
  let i=1;
  i<rows.length;
  i++
 ){

  const row=
  rows[i]

  if(
   !row
   ||
   !row.length
  )
  continue

  const date=
  parseImportedDate(
   row[dateIndex]
  )

  const merchant=
  String(
   row[descriptionIndex]
   ??
   ""
  ).trim()

  const amount=
  parseImportedAmount(
   row[amountIndex]
  )

  if(
   !date
   ||
   !merchant
   ||
   amount===null
  ){

   invalid++

   continue

  }

  const duplicate=
  expenses.some(
   x=>
   sameExpense(
    x,
    {
     date,
     merchant,
     amount
    }
   )
  )

  if(duplicate){

   duplicates++

   continue

  }

  expenses.push({

   id:
   Date.now()
   +
   i
   +
   Math.floor(
    Math.random()*1000
   ),

   date,

   merchant,

   amount,

   ocr:"",

   photo:""

  })

  imported++

 }

 saveLocal()

 render()

 let message=
 imported+

function parseCSV(text){

 const rows=[]

 let row=[]
 let cell=""
 let quoted=false

 for(
  let i=0;
  i<text.length;
  i++
 ){

  const char=
  text[i]

  const next=
  text[i+1]

  if(char==='"'){

   if(
    quoted
    &&
    next==='"'
   ){

    cell+='"'

    i++

   }
   else{

    quoted=
    !quoted

   }

   continue

  }

  if(
   char===';'
   &&
   !quoted
  ){

   row.push(cell)

   cell=""

   continue

  }

  if(
   (
    char==="\n"
    ||
    char==="\r"
   )
   &&
   !quoted
  ){

   if(
    char==="\r"
    &&
    next==="\n"
   ){

    i++

   }

   row.push(cell)

   if(
    row.some(
     value=>
     String(value)
     .trim()!==""
    )
   ){

    rows.push(row)

   }

   row=[]
   cell=""

   continue

  }

  cell+=char

 }

 if(
  cell!==""
  ||
  row.length
 ){

  row.push(cell)

  if(
   row.some(
    value=>
    String(value)
    .trim()!==""
   )
  ){

   rows.push(row)

  }

 }

 return rows

}

function parseImportedDate(value){

 const text=
 String(
  value
  ??
  ""
 )
 .trim()

 let match=
 text.match(
  /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/
 )

 if(match){

  return(
   match[3]+
   "-"+
   String(
    Number(match[2])
   ).padStart(2,"0")
   +
   "-"+
   String(
    Number(match[1])
   ).padStart(2,"0")
  )

 }

 match=
 text.match(
  /^(\d{4})-(\d{1,2})-(\d{1,2})$/
 )

 if(match){

  return(
   match[1]+
   "-"+
   String(
    Number(match[2])
   ).padStart(2,"0")
   +
   "-"+
   String(
    Number(match[3])
   ).padStart(2,"0")
  )

 }

 return ""

}

function parseImportedAmount(value){

 const text=
 String(
  value
  ??
  ""
 )
 .trim()
 .replace(/\s/g,"")
 .replace("€","")
 .replace(",",".")

 const amount=
 Number(text)

 if(
  !Number.isFinite(amount)
  ||
  amount<=0
 ){

  return null

 }

 return amount

}

function normalizeMerchant(value){

 return String(value)
 .trim()
 .toLowerCase()
 .normalize("NFD")
 .replace(
  /[\u0300-\u036f]/g,
  ""
 )
 .replace(
  /\s+/g,
  " "
 )

}

function sameExpense(a,b){

 return(
  a.date===
  b.date
  &&
  normalizeMerchant(
   a.merchant
  )===
  normalizeMerchant(
   b.merchant
  )
  &&
  Math.round(
   Number(a.amount)*100
  )===
  Math.round(
   Number(b.amount)*100
  )
 )

}
