<style>

*{

body{

main{

}

.badge.sent{

}

.badge.reimbursed{

}

}

.bottom{

 background:#f5f7f6;

}

.scan{
 display:block;
 max-width:700px;
 margin:auto;

 background:#236443;
 color:white;
 font-weight:bold;
 font-size:20px
}

.batchBar{
 display:none;
 max-width:700px;
 margin:auto;
 grid-template-columns:1fr 1fr;
 gap:8px
}

.batchBar.open{
 display:grid
}

.batchBar button{
 min-height:52px;
 border:0;
 border-radius:17px;
 padding:7px;
 font-size:14px;
 font-weight:bold
}

.batchSend{
 background:#f4eee2;
 color:#7a5820
}

.batchSent{
 background:#e6eef9;
 color:#315e8d
}

.batchPaid{
 background:#236443;
 color:white
}

.batchDelete{
 background:#fdecec;
 color:#b42318
}

.sheet{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 align-items:flex-end;

}

.sheet.open{
 display:flex
}

.panel{
 background:white;
 width:100%;
 max-width:700px;
 margin:auto;
 padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);
 border-radius:28px 28px 0 0;
 max-height:93vh;
 overflow:auto
}

img{
 width:100%;
 max-height:250px;
 object-fit:contain;
 border-radius:15px
}

label{
 display:block;
 margin:14px 0 6px;
 font-weight:bold
}

input.field,
select.field{
 width:100%;
 height:50px;
 border:1px solid #ddd;
 border-radius:13px;
 padding:10px;
 font-size:17px;
 background:white
}

.statusBox{
 margin-top:10px;
 color:#6c746f;
 font-size:14px;
 line-height:1.5
}

.status{
 margin:12px 0;
 background:#eaf2ee;
 color:#236443;
 padding:12px;

}

.buttons{
 display:flex;
 gap:10px;
 margin-top:20px
}

.buttons button{
 flex:1;
 height:52px;
 border:0;
 border-radius:14px;
 font-weight:bold
}

.cancel{
 background:#eee
}

.save{
 background:#236443;
 color:white
}

.delete{
 width:100%;
 height:52px;
 margin-top:12px;
 border:0;

 color:#b42318;

}

.toast{
 position:fixed;
 left:50%;
 bottom:105px;
 transform:translateX(-50%) translateY(20px);
 background:#111;
 color:white;
 padding:12px 16px;
 border-radius:22px;
 opacity:0;
 transition:.25s;
 z-index:500;
 pointer-events:none;
 white-space:nowrap
}

.toast.show{

 transform:translateX(-50%) translateY(0)
}

<body>

<main>

<div class="top">

<h1>Mes dépenses</h1>

<div class="topRight">

<button
 class="selectBtn"
 id="selectBtn"
 onclick="toggleSelectionMode()"
>
Sélectionner
</button>

<button
 class="addBtn"
 onclick="openManualExpense()"
>
+
</button>

<button
 class="menuBtn"
 onclick="toggleBackupMenu()"
>
•••
</button>

</div>
</div>

<div
 class="backupMenu"
 id="backupMenu"
>

<button onclick="exportCSV()">
⬆️ Exporter CSV
</button>

<button onclick="startCSVImport()">
⬇️ Importer CSV
</button>

</div>

<div class="month">

<button onclick="moveMonth(-1)">‹</button>

<strong id="month"></strong>

<button onclick="moveMonth(1)">›</button>

</div>

<div class="total">

<small>Total du mois</small>

<b id="total">0,00 €</b>

<div id="count">0 dépense</div>

<div
 class="summary"
 id="summary"
></div>

</div>

<input
 class="search"
 id="search"
 placeholder="🔍 Rechercher une dépense"
 oninput="render()"
>

<div id="list"></div>

</main>

<div class="bottom">

<button
 class="scan"
 id="scanButton"
 onclick="startScan()"
>
📷 Scanner un justificatif
</button>

<div
 class="batchBar"
 id="batchBar"
>

<button
 class="batchSend"
 onclick="batchStatus('to_send')"
>
À envoyer
</button>

<button
 class="batchSent"
 onclick="batchStatus('sent')"
>
Envoyées
</button>

<button
 class="batchPaid"
 onclick="batchStatus('reimbursed')"
>
Remboursées
</button>

<button
 class="batchDelete"
 onclick="deleteSelectedExpenses()"
>
🗑 Supprimer
</button>

</div>

</div>

<input
 hidden
 id="camera"
 type="file"
 accept="image/*"
 capture="environment"
>

<input
 hidden
 id="csvInput"
 type="file"
 accept=".csv,text/csv"
>

<div class="sheet" id="sheet">

<div class="panel">

<h2 id="sheetTitle">
Vérifier la dépense
</h2>

<img id="preview">

<div
 class="status"
 id="ocrStatus"
>
Analyse du ticket…
</div>

<label>Date</label>

<input
 class="field"
 type="date"
 id="date"
>

<label>Description / commerçant</label>

<input
 class="field"
 id="merchant"
>

<label>Montant (€)</label>

 class="field"
 type="number"
 step="0.01"
 id="amount"
>

<label>Statut du remboursement</label>

 class="field"
 id="expenseStatus"
 onchange="updateStatusInfo()"
>

<option value="to_send">
À envoyer
</option>

Envoyée
</option>

<option value="reimbursed">
Remboursée
</option>

</select>

<div
 class="statusBox"
 id="statusInfo"
></div>

<div class="buttons">

<button
 class="cancel"
 onclick="closeSheet()"
>
Annuler
</button>

<button
 class="save"
 onclick="saveExpense()"
>
Enregistrer
</button>

</div>

 class="delete"
 id="deleteButton"
 onclick="deleteExpense()"
 style="display:none"
>
Supprimer cette dépense
</button>

</div>

 class="toast"
 id="toast"
>
Dépense enregistrée
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

let currentMonth=
new Date()

let photo=""
let ocr=""
let editingId=null

let selectionMode=false
let selectedIds=new Set()

let originalStatus=null

let expenses=
JSON.parse(
 localStorage.getItem("expenses")
 ||
 "[]"
)

expenses=
expenses.map(
 x=>({
  ...x,
  id:x.id || createFallbackId(),
  status:x.status||"to_send",
  sentDate:x.sentDate||"",
  reimbursedDate:x.reimbursedDate||""
 })
)

saveLocal()

const $=
id=>document.getElementById(id)

function createFallbackId(){

 return(
  Date.now()*1000
  +
  Math.floor(
   Math.random()*1000
  )
 )

}

function createUniqueId(){

 let id

 do{

  id=
  Date.now()*1000
  +
  Math.floor(
   Math.random()*1000
  )

 }
 while(
  expenses.some(
   x=>
   String(x.id)===
   String(id)
  )
 )

 return id

}

function today(){

 return new Date()
 .toISOString()
 .slice(0,10)

}

function showToast(message){

 $("toast").textContent=
 message

 $("toast")
 .classList
 .add("show")

 setTimeout(
  ()=>{
   $("toast")
   .classList
   .remove("show")
  },
  2200
 )

}

function euro(n){

 return new Intl.NumberFormat(
  "fr-FR",
  {
   style:"currency",
   currency:"EUR"
  }
 ).format(n||0)

}

function sameMonth(s,d){

 const x=
 new Date(
  s+"T12:00:00"
 )

 return(
  x.getMonth()===d.getMonth()
  &&
  x.getFullYear()===d.getFullYear()
 )

}

function statusLabel(status){

 if(status==="sent")
 return "Envoyée"

 if(status==="reimbursed")
 return "Remboursée"

 return "À envoyer"

}

function render(){

 const q=
 $("search")
 .value
 .toLowerCase()

 const monthRows=
 expenses.filter(
  x=>
  sameMonth(
   x.date,
   currentMonth
  )
 )

 const rows=
 monthRows
 .filter(
  x=>
  !q
  ||
  x.merchant
   .toLowerCase()
   .includes(q)
  ||
  String(x.amount)
   .includes(q)
 )
 .sort(
  (a,b)=>
  b.date.localeCompare(a.date)
 )

 $("month").textContent=
 new Intl.DateTimeFormat(
  "fr-FR",
  {
   month:"long",
   year:"numeric"
  }
 ).format(currentMonth)

 const total=
 monthRows.reduce(
  (sum,x)=>
  sum+Number(x.amount),
  0
 )

 $("total").textContent=
 euro(total)

 $("count").textContent=
 monthRows.length+
 " dépense"+
 (
  monthRows.length>1
  ?
  "s"
  :
  ""
 )

 const toSend=
 monthRows.filter(
  x=>x.status==="to_send"
 ).length

 const sent=
 monthRows.filter(
  x=>x.status==="sent"
 ).length

 const paid=
 monthRows.filter(
  x=>x.status==="reimbursed"
 ).length

 $("summary").textContent=
 toSend+
 " à envoyer • "+
 sent+
 " envoyée"+
 (sent>1?"s":"")+
 " • "+
 paid+
 " remboursée"+
 (paid>1?"s":"")

 if(!rows.length){

  $("list").innerHTML=
  '<div class="empty">'+
  '👛'+
  '<h2>Aucune dépense</h2>'+
  'Scanne un justificatif ou ajoute une dépense manuellement.'+
  '</div>'

  return

 }

 $("list").innerHTML=
 rows.map(
  x=>{

   const selected=
   selectedIds.has(
    String(x.id)
   )

   const check=
   selectionMode
   ?
   `
   <div class="check ${selected?"selected":""}">
   ${selected?"✓":""}
   </div>
   `
   :
   ""

   return`

   <div
    class="item"
    onclick="handleExpenseClick('${String(x.id)}')"
   >

    <div class="itemLeft">

     ${check}

     <div class="itemText">

      <b>
      ${escapeHTML(x.merchant)}
      </b>

      <span>
      ${formatDate(x.date)}
      </span>

      <div class="badge ${x.status}">
      ${statusLabel(x.status)}
      </div>

     </div>

    </div>

    <div class="itemRight">
     <b>${euro(x.amount)}</b>
    </div>

   </div>

   `

  }
 ).join("")

}

function handleExpenseClick(id){

 if(selectionMode){

  if(selectedIds.has(id))
   selectedIds.delete(id)
  else
   selectedIds.add(id)

  render()

  return
 }

 openExpense(id)

}

function toggleSelectionMode(){

 selectionMode=
 !selectionMode

 selectedIds.clear()

 $("selectBtn").textContent=
 selectionMode
 ?
 "Annuler"
 :
 "Sélectionner"

 $("scanButton").style.display=
 selectionMode
 ?
 "none"
 :
 "block"

 $("batchBar")
 .classList
 .toggle(
  "open",
  selectionMode
 )

 render()

}

function batchStatus(newStatus){

 if(!selectedIds.size){

  alert(
   "Sélectionne au moins une dépense."
  )

  return
 }

 const date=
 today()

 expenses=
 expenses.map(
  expense=>{

   if(
    !selectedIds.has(
     String(expense.id)
    )
   )
   return expense

   if(newStatus==="to_send"){

    return{
     ...expense,
     status:"to_send",
     sentDate:"",
     reimbursedDate:""
    }

   }

   if(newStatus==="sent"){

    return{
     ...expense,
     status:"sent",
     sentDate:date,
     reimbursedDate:""
    }

   }

   return{
    ...expense,
    status:"reimbursed",
    sentDate:
     expense.sentDate||date,
    reimbursedDate:date
   }

  }
 )

 const count=
 selectedIds.size

 saveLocal()

 toggleSelectionMode()

 showToast(
  count+
  " dépense"+
  (count>1?"s":"")+
  " mise"+
  (count>1?"s":"")+
  " à jour"
 )

}

function deleteSelectedExpenses(){

 if(!selectedIds.size){

  alert(
   "Sélectionne au moins une dépense."
  )

  return
 }

 const selectedExpenses=
 expenses.filter(
  x=>
  selectedIds.has(
   String(x.id)
  )
 )

 const count=
 selectedExpenses.length

 const total=
 selectedExpenses.reduce(
  (sum,x)=>
  sum+Number(x.amount),
  0
 )

 const confirmed=
 confirm(
  "Supprimer "+
  count+
  " dépense"+
  (count>1?"s":"")+
  " ?\n\n"+
  "Montant total : "+
  euro(total)+
  "\n\nCette action est définitive."
 )

 if(!confirmed)
 return

 expenses=
 expenses.filter(
  x=>
  !selectedIds.has(
   String(x.id)
  )
 )

 saveLocal()

 selectionMode=false
 selectedIds.clear()

 $("selectBtn").textContent=
 "Sélectionner"

 $("scanButton").style.display=
 "block"

 $("batchBar")
 .classList
 .remove("open")

 render()

 showToast(
  count+
  " dépense"+
  (count>1?"s":"")+
  " supprimée"+
  (count>1?"s":"")
 )

}

function escapeHTML(s){

 return String(s)
 .replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 )

}

function formatDate(s){

 if(!s)
 return ""

 const parts=
 s.split("-")

 if(parts.length!==3)
 return s

 return(
  parts[2]+
  "/"+
  parts[1]+
  "/"+
  parts[0]
 )

}

function moveMonth(n){

 currentMonth=
 new Date(
  currentMonth.getFullYear(),
  currentMonth.getMonth()+n,
  1
 )

 selectedIds.clear()

 render()

}

function toggleBackupMenu(){

 $("backupMenu")
 .classList
 .toggle("open")

}

document.addEventListener(
 "click",
 e=>{

  const menu=
  $("backupMenu")

  const menuButton=
  document.querySelector(
   ".menuBtn"
  )

  if(
   !menu.contains(e.target)
   &&
   e.target!==menuButton
  ){

   menu
   .classList
   .remove("open")

  }

 }
)

function openManualExpense(){

 editingId=null
 originalStatus=null
 photo=""
 ocr=""

 $("sheetTitle").textContent=
 "Nouvelle dépense"

 $("date").value=
 today()

 $("merchant").value=""

 $("amount").value=""

 $("expenseStatus").value=
 "to_send"

 $("preview").src=""

 $("preview").style.display=
 "none"

 $("ocrStatus").style.display=
 "none"

 $("deleteButton").style.display=
 "none"

 updateStatusInfo()

 $("sheet")
 .classList
 .add("open")

}

function startScan(){

 editingId=null
 originalStatus=null
 photo=""
 ocr=""

 $("sheetTitle").textContent=
 "Vérifier la dépense"

 $("expenseStatus").value=
 "to_send"

 $("deleteButton").style.display=
 "none"

 $("camera").click()

}

$("camera").onchange=
async e=>{

 const file=
 e.target.files[0]

 if(!file)
 return

 $("date").value=
 today()

 $("merchant").value=""

 $("amount").value=""

 $("expenseStatus").value=
 "to_send"

 updateStatusInfo()

 $("ocrStatus").style.display=
 "block"

 $("ocrStatus").textContent=
 "Analyse du ticket…"

 const reader=
 new FileReader()

 reader.onload=
 async()=>{

  photo=
  reader.result

  $("preview").src=
  photo

  $("preview").style.display=
  "block"

  $("sheet")
  .classList
  .add("open")

  try{

   const result=
   await Tesseract.recognize(
    photo,
    "fra+eng",
    {
     logger:m=>{

      if(
       m.status===
       "recognizing text"
      ){

       $("ocrStatus").textContent=
       "Lecture du ticket… "+
       Math.round(
        (m.progress||0)*100
       )+
       " %"

      }

     }
    }
   )

   ocr=
   result.data.text||""

   const detectedDate=
   findDate(ocr)

   const detectedAmount=
   findAmount(ocr)

   const detectedMerchant=
   findMerchant(ocr)

   if(detectedDate)
   $("date").value=
   detectedDate

   if(detectedAmount!==null)
   $("amount").value=
   detectedAmount.toFixed(2)

   $("merchant").value=
   detectedMerchant

   $("ocrStatus").textContent=
   "Ticket analysé — vérifie puis enregistre."

  }

  catch(error){

   $("ocrStatus").textContent=
   "Lecture automatique impossible. Tu peux remplir les champs manuellement."

  }

 }

 reader.readAsDataURL(file)

 e.target.value=""

}

function lines(text){

 return text
 .split(/\r?\n/)
 .map(
  x=>x.trim()
 )
 .filter(Boolean)

}

function findDate(text){

 let match=
 text.match(
  /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{4})\b/
 )

 if(!match){

  match=
  text.match(
   /\b([0-3]?\d)[\/.\-]([01]?\d)[\/.\-](\d{2})\b/
  )

 }

 if(!match)
 return ""

 let year=
 Number(match[3])

 if(year<100)
 year+=2000

 return(
  year+
  "-"+
  String(
   Number(match[2])
  ).padStart(2,"0")
  +
  "-"+
  String(
   Number(match[1])
  ).padStart(2,"0")
 )

}

function getAmount(line){

 const matches=
 [...line.matchAll(
  /(\d{1,6}[,.]\d{2})/g
 )]

 if(!matches.length)
 return null

 return Number(
  matches[
   matches.length-1
  ][1]
  .replace(",",".")
 )

}

function findAmount(text){

 const textLines=
 lines(text)

 const keys=[
  "TOTAL TTC",
  "NET A PAYER",
  "NET À PAYER",
  "A PAYER",
  "À PAYER",
  "TOTAL",
  "MONTANT"
 ]

 for(const key of keys){

  for(
   const line of
   textLines
   .filter(
    x=>
    x.toUpperCase()
    .includes(key)
   )
   .reverse()
  ){

   const amount=
   getAmount(line)

   if(amount!==null)
   return amount

  }

 }

 const values=
 textLines
 .map(getAmount)
 .filter(
  x=>
  x!==null
  &&
  x>0
 )

 return(
  values.length
  ?
  Math.max(...values)
  :
  null
 )

}

function findMerchant(text){

 const ignore=
 /ticket|facture|total|tva|merci|carte|visa|date|siret|www|http/i

 for(
  const line of
  lines(text).slice(0,12)
 ){

  if(
   line.length<3
   ||
   line.length>60
   ||
   ignore.test(line)
  )
  continue

  if(
   (
    line.match(
     /[A-Za-zÀ-ÿ]/g
    )
    ||
    []
   ).length<3
  )
  continue

  return line

 }

 return "Dépense"

}

 const expense=
 expenses.find(
  x=>
  String(x.id)===
  String(id)
 )

 if(!expense)
 return

 editingId=
 String(id)

 originalStatus=
 expense.status||"to_send"

 photo=
 expense.photo||""

 ocr=
 expense.ocr||""

 expense.date

 $("merchant").value=
 expense.merchant

 $("amount").value=
 expense.amount

 $("expenseStatus").value=

 photo

 $("preview").style.display=

  )

function closeSheet(){

 $("sheet")
 .classList
 .remove("open")

 editingId=null
 originalStatus=null

}

function saveExpense(){

 const date=
 $("date").value

 const merchant=
 $("merchant")
 .value
 .trim()

 const amount=
 Number(
  $("amount").value
 )

 const newStatus=
 $("expenseStatus").value

 if(
  !date
  ||
  !merchant
  ||
  !Number.isFinite(amount)
  ||
  amount<=0
 ){

  alert(
   "Vérifie la date, la description et le montant."
  )

  return

 }

 if(editingId){

  const index=
  expenses.findIndex(
   x=>
   String(x.id)===
   String(editingId)
  )

  if(index!==-1){

   let sentDate=
   expenses[index].sentDate||""

   let reimbursedDate=
   expenses[index].reimbursedDate||""

   if(newStatus==="to_send"){

    sentDate=""
    reimbursedDate=""

   }

   if(newStatus==="sent"){

    if(
     originalStatus!=="sent"
     &&
     !sentDate
    )
    sentDate=today()

    reimbursedDate=""

   }

   if(newStatus==="reimbursed"){

    if(!sentDate)
    sentDate=today()

    if(
     originalStatus!=="reimbursed"
     &&
     !reimbursedDate
    )
    reimbursedDate=today()

   }

   expenses[index]={
    ...expenses[index],
    date,
    merchant,
    amount,
    status:newStatus,
    sentDate,
    reimbursedDate
   }

  }

 }

 else{

  let sentDate=""
  let reimbursedDate=""

  if(newStatus==="sent")
  sentDate=today()

  if(newStatus==="reimbursed"){

   sentDate=today()
   reimbursedDate=today()

  }

  expenses.push({

   id:createUniqueId(),

   date,

   merchant,

   amount,

   status:newStatus,

   sentDate,

   reimbursedDate,

   ocr,

   photo

  })

 }

 saveLocal()

 closeSheet()

 render()

 showToast(
  "Dépense enregistrée"
 )

}

function deleteExpense(){

 if(!editingId)
 return

 const expense=
 expenses.find(
  x=>
  String(x.id)===
  String(editingId)
 )

 if(!expense)
 return

 const confirmed=
 confirm(
  "Supprimer cette dépense ?\n\n"+
  expense.merchant+
  " — "+
  euro(expense.amount)
 )

 if(!confirmed)
 return

 expenses=
 expenses.filter(
  x=>
  String(x.id)!==
  String(editingId)
 )

 saveLocal()

 closeSheet()

 render()

 showToast(
  "Dépense supprimée"
 )

}

function saveLocal(){

 localStorage.setItem(
  "expenses",
  JSON.stringify(expenses)
 )

}

function exportCSV(){

 $("backupMenu")
 .classList
 .remove("open")

 if(!expenses.length){

  alert(
   "Aucune dépense à exporter."
  )

  return
 }

 const sorted=
 [...expenses]
 .sort(
  (a,b)=>
  a.date.localeCompare(b.date)
 )

 let csv=
 "\uFEFFID;Date;Description;Montant;Statut;Date envoi;Date remboursement\n"

 for(const expense of sorted){

  csv+=
  csvEscape(
   expense.id
  )
  +
  ";"
  +
  csvEscape(
   formatDate(expense.date)
  )
  +
  ";"
  +
  csvEscape(
   expense.merchant
  )
  +
  ";"
  +
  Number(
   expense.amount
  )
  .toFixed(2)
  .replace(".",",")
  +
  ";"
  +
  csvEscape(
   statusLabel(
    expense.status||"to_send"
   )
  )
  +
  ";"
  +
  csvEscape(
   formatDate(
    expense.sentDate||""
   )
  )
  +
  ";"
  +
  csvEscape(
   formatDate(
    expense.reimbursedDate||""
   )
  )
  +
  "\n"

 }

 const blob=
 new Blob(
  [csv],
  {
   type:"text/csv;charset=utf-8"
  }
 )

 const url=
 URL.createObjectURL(blob)

 const link=
 document.createElement("a")

 link.href=url

 link.download=
 "notes-de-frais.csv"

 link.click()

 setTimeout(
  ()=>{
   URL.revokeObjectURL(url)
  },
  1000
 )

}

function csvEscape(value){

 value=
 String(
  value??""
 )

 if(
  value.includes(";")
  ||
  value.includes('"')
  ||
  value.includes("\n")
 ){

  return(
   '"'+
   value.replaceAll(
    '"',
    '""'
   )+
   '"'
  )

 }

 return value

}

function startCSVImport(){

 $("backupMenu")
 .classList
 .remove("open")

 $("csvInput").click()

}

$("csvInput").onchange=
e=>{

 const file=
 e.target.files[0]

 if(!file)
 return

 const reader=
 new FileReader()

 reader.onload=
 ()=>{

  try{

   importCSVText(
    reader.result
   )

  }
  catch(error){

   alert(
    "Impossible de lire ce fichier CSV."
   )

  }

 }

 reader.readAsText(
  file,
  "UTF-8"
 )

 e.target.value=""

}

function importCSVText(text){

 text=
 String(text)
 .replace(
  /^\uFEFF/,
  ""
 )

 const rows=
 parseCSV(text)

 if(rows.length<2){

  alert(
   "Le fichier CSV ne contient aucune dépense."
  )

  return

 }

 const headers=
 rows[0]
 .map(
  x=>
  x.trim()
  .toLowerCase()
 )

 const idIndex=
 headers.findIndex(
  x=>
  x==="id"
  ||
  x==="id dépense"
  ||
  x==="id depense"
 )

 const dateIndex=
 headers.findIndex(
  x=>x==="date"
 )

 const descriptionIndex=
 headers.findIndex(
  x=>
  x==="description"
  ||
  x==="commerçant"
  ||
  x==="commercant"
 )

 const amountIndex=
 headers.findIndex(
  x=>
  x==="montant"
  ||
  x==="amount"
 )

 const statusIndex=
 headers.findIndex(
  x=>
  x==="statut"
  ||
  x==="status"
 )

 const sentIndex=
 headers.findIndex(
  x=>
  x==="date envoi"
  ||
  x==="date d'envoi"
 )

 const reimbursedIndex=
 headers.findIndex(
  x=>
  x==="date remboursement"
  ||
  x==="date de remboursement"
 )

 if(
  dateIndex===-1
  ||
  descriptionIndex===-1
  ||
  amountIndex===-1
 ){

  alert(
   "CSV non reconnu.\n\nColonnes attendues : Date ; Description ; Montant"
  )

  return

 }

 let imported=0
 let duplicates=0
 let invalid=0
 let generatedIds=0

 for(
  let i=1;
  i<rows.length;
  i++
 ){

  const row=
  rows[i]

  const date=
  parseImportedDate(
   row[dateIndex]
  )

  const merchant=
  String(
   row[descriptionIndex]??""
  )
  .trim()

  const amount=
  parseImportedAmount(
   row[amountIndex]
  )

  if(
   !date
   ||
   !merchant
   ||
   amount===null
  ){

   invalid++

   continue

  }

  let importedId=""

  if(idIndex!==-1){

   importedId=
   String(
    row[idIndex]??""
   )
   .trim()

  }

  if(importedId){

   const alreadyExists=
   expenses.some(
    expense=>
    String(expense.id)===
    importedId
   )

   if(alreadyExists){

    duplicates++

    continue

   }

  }
  else{

   importedId=
   createUniqueId()

   generatedIds++

  }

  let status="to_send"

  if(statusIndex!==-1){

   const value=
   String(
    row[statusIndex]||""
   )
   .trim()
   .toLowerCase()

   if(
    value.includes("rembours")
   ){

    status="reimbursed"

   }

   else if(
    value.includes("envoy")
    &&
    !value.includes("à envoyer")
   ){

    status="sent"

   }

  }

  const sentDate=
  sentIndex!==-1
  ?
  parseImportedDate(
   row[sentIndex]
  )
  :
  ""

  const reimbursedDate=
  reimbursedIndex!==-1
  ?
  parseImportedDate(
   row[reimbursedIndex]
  )
  :
  ""

  expenses.push({

   id:importedId,

   date,

   merchant,

   amount,

   status,

   sentDate,

   reimbursedDate,

   ocr:"",

   photo:""

  })

  imported++

 }

 saveLocal()

 render()

 let message=
 imported+
 " dépense"+
 (
  imported>1
  ?
  "s"
  :
  ""
 )+
 " importée"+
 (
  imported>1
  ?
  "s"
  :
  ""
 )

 if(duplicates){

  message+=
  "\n"+
  duplicates+
  " ID déjà présent"+
  (
   duplicates>1
   ?
   "s"
   :
   ""
  )+
  " ignoré"+
  (
   duplicates>1
   ?
   "s"
   :
   ""
  )

 }

 if(generatedIds){

  message+=
  "\n"+
  generatedIds+
  " nouvel"+
  (
   generatedIds>1
   ?
   "s"
   :
   ""
  )+
  " ID créé"+
  (
   generatedIds>1
   ?
   "s"
   :
   ""
  )

 }

 if(invalid){

  message+=
  "\n"+
  invalid+
  " ligne"+
  (
   invalid>1
   ?
   "s"
   :
   ""
  )+
  " non reconnue"+
  (
   invalid>1
   ?
   "s"
   :
   ""
  )

 }

 alert(message)

}

function parseCSV(text){

 const rows=[]

 let row=[]
 let cell=""
 let quoted=false

 for(
  let i=0;
  i<text.length;
  i++
 ){

  const char=
  text[i]

  const next=
  text[i+1]

  if(char==='"'){

   if(
    quoted
    &&
    next==='"'
   ){

    cell+='"'
    i++

   }
   else{

    quoted=
    !quoted

   }

   continue

  }

  if(
   char===';'
   &&
   !quoted
  ){

   row.push(cell)
   cell=""

   continue

  }

  if(
   (
    char==="\n"
    ||
    char==="\r"
   )
   &&
   !quoted
  ){

   if(
    char==="\r"
    &&
    next==="\n"
   )
   i++

   row.push(cell)

   if(
    row.some(
     value=>
     String(value)
     .trim()!==""
    )
   )
   rows.push(row)

   row=[]
   cell=""

   continue

  }

  cell+=char

 }

 if(
  cell!==""
  ||
  row.length
 ){

  row.push(cell)

  if(
   row.some(
    value=>
    String(value)
    .trim()!==""
   )
  )
  rows.push(row)

 }

 return rows

}

function parseImportedDate(value){

 const text=
 String(
  value||""
 )
 .trim()

 if(!text)
 return ""

 let match=
 text.match(
  /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/
 )

 if(match){

  return(
   match[3]+
   "-"+
   String(
    Number(match[2])
   ).padStart(2,"0")
   +
   "-"+
   String(
    Number(match[1])
   ).padStart(2,"0")
  )

 }

 match=
 text.match(
  /^(\d{4})-(\d{1,2})-(\d{1,2})$/
 )

 if(match){

  return(
   match[1]+
   "-"+
   String(
    Number(match[2])
   ).padStart(2,"0")
   +
   "-"+
   String(
    Number(match[3])
   ).padStart(2,"0")
  )

 }

 return ""

}

function parseImportedAmount(value){

 const text=
 String(
  value||""
 )
 .trim()
 .replace(/\s/g,"")
 .replace("€","")
 .replace(",",".")

 const amount=
 Number(text)

 if(
  !Number.isFinite(amount)
  ||
  amount<=0
 )
 return null

 return amount

}
